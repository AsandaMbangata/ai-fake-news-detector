name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install fastapi
          pip install uvicorn
          pip install pytest
          pip install pytest-cov
          pip install httpx

      - name: Run tests
        run: |
          pytest

      - name: Run coverage
        run: |
          pytest --cov=services --cov=api --cov=repositories

  build-artifact:

    needs: test

    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release artifact
        run: |
          zip -r ai-fake-news-detector.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-fake-news-detector
          path: ai-fake-news-detector.zip